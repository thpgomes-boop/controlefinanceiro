<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Família</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finanças">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#10b981', darkBg: '#0f172a', cardBg: '#1e293b' }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 dark:bg-darkBg text-slate-800 dark:text-slate-100 min-h-screen pb-20 transition-colors duration-300">

    <header class="bg-white dark:bg-cardBg shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <div class="bg-emerald-500 text-white p-2 rounded-xl shadow">
                    <i class="fa-solid fa-wallet text-base"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-tight">Finanças Família</h1>
                    <span id="sync-status" class="text-[10px] text-amber-500 font-medium hidden">A sincronizar...</span>
                </div>
            </div>
            <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- ==========================================
             ABA 1: EXECUTAR (GASTOS E PENDÊNCIAS) 
             ========================================== -->
        <section id="view-executar" class="space-y-4">
            
            <!-- 1. GASTO RÁPIDO (AVULSO) -->
            <div class="bg-white dark:bg-cardBg p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                <h2 class="text-sm font-bold mb-3 flex items-center space-x-2 text-emerald-600 dark:text-emerald-400">
                    <i class="fa-solid fa-bolt"></i><span>Gasto Rápido / Avulso</span>
                </h2>
                <form onsubmit="salvarTransacao(event, 'exec')" class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" id="btn-exec-Despesa" onclick="setTipo('Despesa', 'exec')" class="py-2 rounded-xl text-sm font-semibold border bg-rose-500 text-white border-rose-500 shadow-sm">Despesa</button>
                        <button type="button" id="btn-exec-Receita" onclick="setTipo('Receita', 'exec')" class="py-2 rounded-xl text-sm font-semibold border bg-slate-100 dark:bg-slate-800 text-slate-500 border-slate-200 dark:border-slate-700">Receita</button>
                    </div>

                    <div class="flex space-x-2">
                        <div class="w-1/2">
                            <label class="block text-[10px] font-semibold uppercase text-slate-400 mb-1">Data</label>
                            <input type="date" id="exec-data" required class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div class="w-1/2">
                            <label class="block text-[10px] font-semibold uppercase text-slate-400 mb-1">Valor</label>
                            <input type="text" id="exec-valor" placeholder="R$ 0,00" required oninput="formatarMoeda(this)" class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-base font-bold text-emerald-600 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <select id="exec-categoria" onchange="atualizarSubcategorias('exec')" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-[11px] focus:ring-2 outline-none"></select>
                        <select id="exec-subcategoria" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-[11px] focus:ring-2 outline-none"></select>
                    </div>

                    <input type="text" id="exec-descricao" placeholder="Descrição rápida..." required class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-sm outline-none">
                    
                    <div class="flex justify-between items-center space-x-2">
                        <select id="exec-pagamento" class="w-1/2 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-
