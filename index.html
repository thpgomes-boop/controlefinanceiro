<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro Pessoal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981',
                        darkBg: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 dark:bg-darkBg text-slate-800 dark:text-slate-100 min-h-screen pb-20 transition-colors duration-300">

    <!-- Header -->
    <header class="bg-white dark:bg-cardBg shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <div class="bg-emerald-500 text-white p-2 rounded-xl shadow">
                    <i class="fa-solid fa-wallet text-base"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-tight">Finanças Família</h1>
                    <span id="sync-status" class="text-[10px] text-amber-500 font-medium hidden">Sincronizando...</span>
                </div>
            </div>
            <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Main Container / Views -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- ABA 1: NOVO LANÇAMENTO -->
        <section id="view-lancamento" class="space-y-4">
            <div class="bg-white dark:bg-cardBg p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                <h2 class="text-base font-bold mb-4 flex items-center space-x-2">
                    <i class="fa-solid fa-circle-plus text-emerald-500"></i>
                    <span>Novo Lançamento</span>
                </h2>
                <form id="form-transacao" onsubmit="salvarTransacao(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Tipo de Movimento</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" id="btn-tipo-despesa" onclick="setTipo('Despesa')" class="py-2.5 rounded-xl text-sm font-semibold border transition bg-rose-500 text-white border-rose-500 shadow-sm">Despesa</button>
                            <button type="button" id="btn-tipo-receita" onclick="setTipo('Receita')" class="py-2.5 rounded-xl text-sm font-semibold border transition bg-slate-100 dark:bg-slate-800 text-slate-500 border-slate-200 dark:border-slate-700">Receita</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Status</label>
                            <select id="status" class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                <option value="Executado">Executado</option>
                                <option value="Planejado">Planejado</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Data</label>
                            <input type="date" id="data" required class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                    </div>

                    <!-- Valor Estilo PIX / Banco -->
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Valor (R$)</label>
                        <input type="text" id="valor-input" placeholder="R$ 0,00" required oninput="formatarValorPix(this)" class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-lg font-bold text-emerald-600 dark:text-emerald-400 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>

                    <!-- Bloco Categoria -->
                    <div class="p-3.5 bg-slate-50 dark:bg-slate-800/40 rounded-xl border border-slate-200 dark:border-slate-700/60 space-y-2">
                        <div class="flex justify-between items-center">
                            <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-300">Categoria</label>
                            <button type="button" onclick="abrirModalItem('categoria')" class="text-xs text-emerald-600 dark:text-emerald-400 font-semibold hover:underline flex items-center space-x-1">
                                <i class="fa-solid fa-plus-circle"></i> <span>Nova Categoria</span>
                            </button>
                        </div>
                        <select id="categoria" onchange="atualizarSubcategorias()" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <!-- Preenchido via JS -->
                        </select>
                    </div>

                    <!-- Bloco Subcategoria -->
                    <div class="p-3.5 bg-slate-50 dark:bg-slate-800/40 rounded-xl border border-slate-200 dark:border-slate-700/60 space-y-2">
                        <div class="flex justify-between items-center">
                            <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-300">Subcategoria</label>
                            <button type="button" onclick="abrirModalItem('subcategoria')" class="text-xs text-emerald-600 dark:text-emerald-400 font-semibold hover:underline flex items-center space-x-1">
                                <i class="fa-solid fa-plus-circle"></i> <span>Nova Subcategoria</span>
                            </button>
                        </div>
                        <select id="subcategoria" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <!-- Preenchido via JS -->
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Forma de Pagamento</label>
                        <select id="pagamento" class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="Pix">Pix</option>
                            <option value="Cartão de Crédito">Cartão de Crédito</option>
                            <option value="Cartão de Débito">Cartão de Débito</option>
                            <option value="Dinheiro">Dinheiro</option>
                            <option value="Boleto">Boleto</option>
                            <option value="Desconto em Folha">Desconto em Folha</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Descrição / Observação</label>
                        <input type="text" id="descricao" placeholder="Ex: Supermercado mensal..." required class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>

                    <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/20 transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-check"></i>
                        <span>Salvar Lançamento</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- ABA 2: RESUMO E GRÁFICOS -->
        <section id="view-resumo" class="space-y-4 hidden">
            <div class="bg-white dark:bg-cardBg p-3 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <span class="text-xs font-semibold uppercase text-slate-400 ml-1">Mês de Referência:</span>
                <input type="month" id="filtro-mes" onchange="atualizarDados()" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div class="grid grid-cols-1 gap-3">
                <div class="bg-white dark:bg-cardBg p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex justify-between items-center">
                    <div>
                        <p class="text-xs font-medium text-slate-400">Saldo no Mês (Executado)</p>
                        <h3 id="card-saldo" class="text-xl font-bold mt-0.5">R$ 0,00</h3>
                    </div>
                    <div class="p-2.5 bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 rounded-xl"><i class="fa-solid fa-scale-balanced"></i></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white dark:bg-cardBg p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                        <p class="text-[11px] font-medium text-slate-400">Receitas</p>
                        <h3 id="card-receitas" class="text-base font-bold text-emerald-600 dark:text-emerald-400 mt-0.5">R$ 0,00</h3>
                    </div>
                    <div class="bg-white dark:bg-cardBg p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                        <p class="text-[11px] font-medium text-slate-400">Despesas</p>
                        <h3 id="card-despesas" class="text-base font-bold text-rose-600 dark:text-rose-400 mt-0.5">R$ 0,00</h3>
                    </div>
                </div>
            </div>

            <div class="bg-white dark:bg-cardBg p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                <h3 class="text-sm font-semibold mb-3">Balanço do Mês</h3>
                <div class="relative h-48"><canvas id="barChart"></canvas></div>
            </div>
            <div class="bg-white dark:bg-cardBg p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                <h3 class="text-sm font-semibold mb-3">Gastos por Categoria</h3>
                <div class="relative h-56 flex justify-center"><canvas id="doughnutChart"></canvas></div>
            </div>
        </section>

        <!-- ABA 3: CONSULTAS E HISTÓRICO -->
        <section id="view-historico" class="space-y-4 hidden">
            <div class="bg-white dark:bg-cardBg rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
                <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                    <h3 class="text-sm font-semibold">Todos os Lançamentos</h3>
                    <span id="total-registros" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 font-medium">0 reg.</span>
                </div>
                <div id="lista-transacoes" class="divide-y divide-slate-100 dark:divide-slate-800 max-h-[70vh] overflow-y-auto">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </section>

    </main>

    <!-- Modal Adicionar Categoria / Subcategoria -->
    <div id="modal-item" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-cardBg w-full max-w-sm rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                <h3 id="modal-titulo" class="font-bold text-sm">Adicionar</h3>
                <button onclick="fecharModalItem()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-4 space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Nome</label>
                    <input type="text" id="novo-item-input" placeholder="Digite o nome..." class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button onclick="salvarNovoItem()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm shadow transition">Adicionar</button>
            </div>
        </div>
    </div>

    <!-- Barra de Navegação Inferior (Abas) -->
    <nav class="bg-white dark:bg-cardBg border-t border-slate-200 dark:border-slate-700 fixed bottom-0 left-0 right-0 z-50 shadow-lg">
        <div class="max-w-md mx-auto grid grid-cols-3 py-2">
            <button onclick="mudarAba('lancamento')" id="tab-btn-lancamento" class="flex flex-col items-center justify-center space-y-1 text-emerald-600 dark:text-emerald-400 transition">
                <i class="fa-solid fa-plus-circle text-lg"></i>
                <span class="text-[11px] font-medium">Lançar</span>
            </button>
            <button onclick="mudarAba('resumo')" id="tab-btn-resumo" class="flex flex-col items-center justify-center space-y-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
                <i class="fa-solid fa-chart-pie text-lg"></i>
                <span class="text-[11px] font-medium">Resumo</span>
            </button>
            <button onclick="mudarAba('historico')" id="tab-btn-historico" class="flex flex-col items-center justify-center space-y-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
                <i class="fa-solid fa-list-ul text-lg"></i>
                <span class="text-[11px] font-medium">Consultas</span>
            </button>
        </div>
    </nav>

    <!-- Script de Controle -->
    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxrQLNpg8kh9DX-IOdG6JbCnyFvaarsM6YuQc5agDyQnVEbb_FpQJGOg6lxXY3SYF4u/exec";

        let estruturaCategorias = JSON.parse(localStorage.getItem('finance_estrutura')) || {
            Receita: {
                "Salário": ["Salário Mensal", "13º Salário e Bônus"],
                "Freelance": ["Projetos e Consultorias"],
                "Investimentos": ["Dividendos e Juros"],
                "Adicional Militar": ["Adicional de Habilitação", "Adicional de Disponibilidade", "Gratificação Especial"]
            },
            Despesa: {
                "Moradia": ["Aluguel e Condomínio", "Energia Elétrica", "Água e Esgoto", "Internet e TV", "Manutenção e Reformas"],
                "Alimentação": ["Supermercado", "Restaurante e Bares", "Delivery e Lanches", "Feira e Padaria"],
                "Transporte": ["Combustível", "Transporte Público", "Aplicativos (Uber/99)", "Manutenção e Seguro"],
                "Saúde": ["Farmácia e Medicamentos", "Consultas e Exames", "Plano de Saúde"],
                "Educação": ["Cursos e Capacitação", "Livros e Materiais", "Faculdade e Pós"],
                "Pensão Militar": ["Pensão Militar - Militar de Carreira"],
                "PNR": ["Ocupação PNR", "PNR - Fundo Ex MNT"],
                "FUSEX": ["FUSEX (Mensalidade 3%)", "Despesa Médica - FUSEX"],
                "Empréstimo Consignado": ["Empréstimo Bradesco"],
                "Outros": ["Imposto de Renda", "Tarifas Bancárias"]
            }
        };

        let transacoes = JSON.parse(localStorage.getItem('finance_transacoes')) || [];
        let tipoAtual = 'Despesa';
        let tipoModalAtual = ''; 
        let valorNumericoReal = 0; 
        let barChartInstance = null;
        let doughnutChartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            const hoje = new Date();
            document.getElementById('filtro-mes').value = hoje.toISOString().slice(0, 7);
            document.getElementById('data').valueAsDate = hoje;
            atualizarCategorias();
            atualizarDados();
        });

        function formatarValorPix(input) {
            let apenasNumeros = input.value.replace(/\D/g, '');
            if (!apenasNumeros) apenasNumeros = '0';
            
            valorNumericoReal = parseFloat(apenasNumeros) / 100;
            
            input.value = valorNumericoReal.toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            });
        }

        function mudarAba(aba) {
            ['lancamento', 'resumo', 'historico'].forEach(a => {
                document.getElementById(`view-${a}`).classList.add('hidden');
                document.getElementById(`tab-btn-${a}`).className = "flex flex-col items-center justify-center space-y-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition";
            });
            document.getElementById(`view-${aba}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${aba}`).className = "flex flex-col items-center justify-center space-y-1 text-emerald-600 dark:text-emerald-400 transition";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setTipo(tipo) {
            tipoAtual = tipo;
            const btnDesp = document.getElementById('btn-tipo-despesa');
            const btnRec = document.getElementById('btn-tipo-receita');

            if (tipo === 'Despesa') {
                btnDesp.className = "py-2.5 rounded-xl text-sm font-semibold border transition bg-rose-500 text-white border-rose-500 shadow-sm";
                btnRec.className = "py-2.5 rounded-xl text-sm font-semibold border transition bg-slate-100 dark:bg-slate-800 text-slate-500 border-slate-200 dark:border-slate-700";
            } else {
                btnRec.className = "py-2.5 rounded-xl text-sm font-semibold border transition bg-emerald-600 text-white border-emerald-600 shadow-sm";
                btnDesp.className = "py-2.5 rounded-xl text-sm font-semibold border transition bg-slate-100 dark:bg-slate-800 text-slate-500 border-slate-200 dark:border-slate-700";
            }
            atualizarCategorias();
        }

        function atualizarCategorias() {
            const selectCategoria = document.getElementById('categoria');
            selectCategoria.innerHTML = '';
            const categorias = Object.keys(estruturaCategorias[tipoAtual]);
            
            categorias.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                selectCategoria.appendChild(opt);
            });
            atualizarSubcategorias();
        }

        function atualizarSubcategorias() {
            const catSelecionada = document.getElementById('categoria').value;
            const selectSub = document.getElementById('subcategoria');
            selectSub.innerHTML = '';
            
            const subcategorias = estruturaCategorias[tipoAtual][catSelecionada] || [];
            subcategorias.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.textContent = sub;
                selectSub.appendChild(opt);
            });
        }

        function abrirModalItem(tipo) {
            tipoModalAtual = tipo;
            const titulo = tipo === 'categoria' ? 'Nova Categoria' : 'Nova Subcategoria';
            document.getElementById('modal-titulo').textContent = titulo;
            document.getElementById('modal-item').classList.remove('hidden');
            document.getElementById('modal-item').classList.add('flex');
            document.getElementById('novo-item-input').focus();
        }

        function fecharModalItem() {
            document.getElementById('modal-item').classList.remove('flex');
            document.getElementById('modal-item').classList.add('hidden');
            document.getElementById('novo-item-input').value = '';
        }

        function salvarNovoItem() {
            const nome = document.getElementById('novo-item-input').value.trim();
            if (!nome) {
                alert('Digite um nome válido.');
                return;
            }

            if (tipoModalAtual === 'categoria') {
                if (!estruturaCategorias[tipoAtual][nome]) {
                    estruturaCategorias[tipoAtual][nome] = [];
                    localStorage.setItem('finance_estrutura', JSON.stringify(estruturaCategorias));
                    atualizarCategorias();
                    document.getElementById('categoria').value = nome;
                    atualizarSubcategorias();
                } else {
                    alert('Esta categoria já existe.');
                }
            } else {
                const catSelecionada = document.getElementById('categoria').value;
                if (!estruturaCategorias[tipoAtual][catSelecionada].includes(nome)) {
                    estruturaCategorias[tipoAtual][catSelecionada].push(nome);
                    localStorage.setItem('finance_estrutura', JSON.stringify(estruturaCategorias));
                    atualizarSubcategorias();
                    document.getElementById('subcategoria').value = nome;
                } else {
                    alert('Esta subcategoria já existe nesta categoria.');
                }
            }
            fecharModalItem();
        }

        async function salvarTransacao(e) {
            e.preventDefault();
            
            if (valorNumericoReal <= 0) {
                alert('Por favor, informe um valor válido.');
                return;
            }

            const nova = {
                id: Date.now(),
                tipo: tipoAtual,
                status: document.getElementById('status').value,
                data: document.getElementById('data').value,
                categoria: document.getElementById('categoria').value,
                subcategoria: document.getElementById('subcategoria').value,
                pagamento: document.getElementById('pagamento').value,
                descricao: document.getElementById('descricao').value,
                valor: valorNumericoReal
            };

            transacoes.push(nova);
            localStorage.setItem('finance_transacoes', JSON.stringify(transacoes));
            
            // Resetar formulário
            document.getElementById('valor-input').value = '';
            valorNumericoReal = 0;
            document.getElementById('descricao').value = '';
            document.getElementById('data').valueAsDate = new Date();
            atualizarDados();

            if (APPS_SCRIPT_URL) {
                const statusEl = document.getElementById('sync-status');
                statusEl.textContent = "Sincronizando...";
                statusEl.classList.remove('hidden');

                try {
                    await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            ...nova,
                            categoria: `${nova.categoria} > ${nova.subcategoria}`
                        })
                    });
                    statusEl.textContent = "Salvo no Drive!";
                    setTimeout(() => statusEl.classList.add('hidden'), 3000);
                } catch (err) {
                    console.error("Erro ao sincronizar:", err);
                    statusEl.textContent = "Erro na sincronização";
                }
            }

            mudarAba('historico');
        }

        function excluirTransacao(id) {
            if (confirm('Deseja realmente excluir este lançamento?')) {
                transacoes = transacoes.filter(t => t.id !== id);
                localStorage.setItem('finance_transacoes', JSON.stringify(transacoes));
                atualizarDados();
            }
        }

        function atualizarDados() {
            const mesFiltro = document.getElementById('filtro-mes').value;
            const transacoesFiltradas = transacoes.filter(t => t.data.startsWith(mesFiltro));
            transacoesFiltradas.sort((a, b) => new Date(b.data) - new Date(a.data));

            let totalReceitas = 0;
            let totalDespesas = 0;

            const listaEl = document.getElementById('lista-transacoes');
            listaEl.innerHTML = '';

            if (transacoesFiltradas.length === 0) {
                listaEl.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm">Nenhum lançamento neste mês.</div>`;
            }

            transacoesFiltradas.forEach(t => {
                if (t.status === 'Executado') {
                    if (t.tipo === 'Receita') totalReceitas += t.valor;
                    else totalDespesas += t.valor;
                }

                const div = document.createElement('div');
                div.className = "p-3.5 flex justify-between items-center hover:bg-slate-50 dark:hover:bg-slate-800/40 transition";
                div.innerHTML = `
                    <div class="space-y-0.5">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-semibold ${t.tipo === 'Receita' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">${t.categoria} (${t.subcategoria})</span>
                            <span class="text-[10px] px-1.5 py-0.5 rounded ${t.status === 'Executado' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400' : 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-400'} font-medium">${t.status}</span>
                            <span class="text-[10px] text-slate-400">• ${formatarData(t.data)}</span>
                        </div>
                        <p class="text-xs text-slate-600 dark:text-slate-300">${t.descricao} <span class="text-[10px] text-slate-400">(${t.pagamento})</span></p>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="text-sm font-bold ${t.tipo === 'Receita' ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-700 dark:text-slate-200'}">
                            ${t.tipo === 'Receita' ? '+' : '-'} R$ ${t.valor.toFixed(2).replace('.', ',')}
                        </span>
                        <button onclick="excluirTransacao(${t.id})" class="text-slate-300 hover:text-rose-500 transition p-1">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
                listaEl.appendChild(div);
            });

            const saldo = totalReceitas - totalDespesas;
            document.getElementById('card-saldo').textContent = `R$ ${saldo.toFixed(2).replace('.', ',')}`;
            document.getElementById('card-saldo').className = `text-xl font-bold mt-0.5 ${saldo >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}`;
            document.getElementById('card-receitas').textContent = `R$ ${totalReceitas.toFixed(2).replace('.', ',')}`;
            document.getElementById('card-despesas').textContent = `R$ ${totalDespesas.toFixed(2).replace('.', ',')}`;
            document.getElementById('total-registros').textContent = `${transacoesFiltradas.length} reg.`;

            atualizarGraficos(transacoesFiltradas);
        }

        function formatarData(dataIso) {
            const [ano, mes, dia] = dataIso.split('-');
            return `${dia}/${mes}`;
        }

        function atualizarGraficos(filtradas) {
            const executadas = filtradas.filter(t => t.status === 'Executado');
            const recTotal = executadas.filter(t => t.tipo === 'Receita').reduce((acc, t) => acc + t.valor, 0);
            const despTotal = executadas.filter(t => t.tipo === 'Despesa').reduce((acc, t) => acc + t.valor, 0);

            const ctxBar = document.getElementById('barChart').getContext('2d');
            if (barChartInstance) barChartInstance.destroy();
            barChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: ['Receitas', 'Despesas'],
                    datasets: [{
                        data: [recTotal, despTotal],
                        backgroundColor: ['#10b981', '#f43f5e'],
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });

            const despesasPorCat = {};
            executadas.filter(t => t.tipo === 'Despesa').forEach(t => {
                despesasPorCat[t.categoria] = (despesasPorCat[t.categoria] || 0) + t.valor;
            });

            const ctxDoughnut = document.getElementById('doughnutChart').getContext('2d');
            if (doughnutChartInstance) doughnutChartInstance.destroy();
            doughnutChartInstance = new Chart(ctxDoughnut, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(despesasPorCat),
                    datasets: [{
                        data: Object.values(despesasPorCat),
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#6366f1']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } }
                }
            });
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            html.classList.toggle('dark');
            icon.className = html.classList.contains('dark') ? "fa-solid fa-moon text-sm" : "fa-solid fa-sun text-sm";
        }
    </script>
</body>
</html>
